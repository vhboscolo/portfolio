titulo = "Plataforma de saúde da Serfaty Clínicas"
chamada = "Do agendamento pelo celular ao prontuário assinado, a clínica inteira numa plataforma"
setor = "Saúde"
status = "Plataforma completa, site no ar"
link = "https://serfatyclinicas.com.br/atlas/"
link_rotulo = "Abrir o atlas 3D no site da clínica"
resumo = "Três pontas na mesma plataforma: a paciente, que agenda, preenche a ficha e manda exames pelo celular; a equipe, que recebe, atende, prescreve e assina; e a direção, que controla quem acessa cada prontuário. Mais o site da clínica, com atlas do corpo em 3D e calculadora de risco."
ganho = """
A paciente chega à consulta com a ficha preenchida, a alergia informada e os exames enviados. A recepção confirma com um toque, a médica abre o prontuário já sabendo o que importa, e a receita confere a alergia antes de deixar assinar.

A direção enxerga tudo: agenda, escala, quem abriu qual ficha e por quê. É o controle que um prontuário de prateleira não entrega, desenhado sob a LGPD desde a primeira linha.
"""
