titulo = "Catálogos de importação para lojistas"
chamada = "A lojista escolhe a peça de fábrica e vê quanto paga e quando"
setor = "Importação e atacado de joias"
status = "Dois catálogos no ar"
link = "https://esmeralda.victorboscolo.com.br"
link_rotulo = "Abrir o catálogo de atacado que está no ar"
resumo = "Dois sistemas para vender peça importada no atacado. Um transforma a planilha da fábrica em catálogo técnico com foto tratada. O outro deixa a lojista montar o pedido vendo o preço de fábrica, a taxa de intermediação em linha separada e o sinal que vai pagar."
ganho = """
A planilha ilegível da fábrica vira vitrine em horas, não em dias. Entrou cotação nova, o catálogo é regerado.

Quem intermedeia para de perder cliente para a fábrica: o nome do fornecedor nunca chega ao navegador, e existe teste automático que barra a publicação se chegar.
"""
