<article class="sistema">
  <header class="sistema-cabeca">
    <h1>$titulo</h1>
    <p class="chamada">$chamada</p>
    <p class="meta"><span>$setor</span> <span class="status">$status</span></p>
  </header>
  <div class="sistema-capa">$capa</div>
  <section class="bloco bloco-ganho" aria-labelledby="t-ganho">
    <h2 id="t-ganho">O que muda no seu negócio</h2>
    $ganho
  </section>
  <section class="bloco" aria-labelledby="t-problema">
    <h2 id="t-problema">O problema</h2>
    $problema
  </section>
  <section class="bloco" aria-labelledby="t-faz">
    <h2 id="t-faz">O que o sistema faz</h2>
    $faz
  </section>
  <section class="bloco bloco-telas" aria-labelledby="t-telas">
    <h2 id="t-telas">Telas</h2>
    $telas
    $video
  </section>
  <section class="bloco bloco-provas" aria-labelledby="t-provas">
    <h2 id="t-provas">O que prova a engenharia</h2>
    $provas
    $decisoes
  </section>
  <section class="bloco" aria-labelledby="t-stack">
    <h2 id="t-stack">Stack</h2>
    <p class="stack">$stack</p>
    $link
  </section>
  <aside class="chamada-final" aria-labelledby="t-chamada">
    <div class="chamada-caixa">
      <h2 id="t-chamada">Quer um sistema assim no seu negócio?</h2>
      <p>$cta_sistema</p>
    </div>
  </aside>
</article>
$vizinhos
