<section class="heroi" aria-labelledby="promessa">
  <div class="heroi-texto">
    <h1 id="promessa">$promessa</h1>
    <div class="heroi-intro">$intro</div>
    <p class="heroi-acoes">$cta_heroi <a class="botao botao-fantasma" href="#sistemas">Ver os sistemas</a></p>
  </div>
  <div class="heroi-palco">$reel</div>
</section>
<section class="faixa-numeros" aria-label="Em números">
$numeros
</section>
<section class="indice-sistemas" id="sistemas" aria-labelledby="t-sistemas">
  <h2 id="t-sistemas">Sistemas que já estão de pé</h2>
$cartoes
</section>
<section class="diferenciais" aria-labelledby="t-diferenciais">
  <h2 id="t-diferenciais">Por que contratar</h2>
$diferenciais
</section>
<section class="quem-faz" aria-labelledby="t-quem">
  <h2 id="t-quem">Quem faz</h2>
  <p class="quem-faz-nome">$autor</p>
  $quem_faz
  <p>$cta_final</p>
</section>
$notas
